<main class="dashboard">

    <h1>SpendWise Dashboard</h1>
    <p>Manage your income and expenses wisely.</p>

    <!-- Budget Section -->
    <section class="budget-section">
        <h2>Monthly Budget</h2>

        <input
            type="number"
            id="budgetInput"
            placeholder="Enter your monthly budget"
            min="0"
        >

        <button type="button" id="setBudgetBtn">
            Set Budget
        </button>

        <p id="budgetStatus">Set your budget to get started.</p>
    </section>

    <!-- Summary Section -->
    <section class="summary">

        <div class="card">
            <h3>Total Expenses</h3>
            <p id="totalExpenses">KSh 0.00</p>
        </div>

        <div class="card">
            <h3>Number of Expenses</h3>
            <p id="expenseCount">0</p>
        </div>

        <div class="card">
            <h3>Remaining Budget</h3>
            <p id="remainingBudget">KSh 0.00</p>
        </div>

    </section>

    <!-- Expense Form -->
    <section class="expense-form">

        <h2>Add New Expense</h2>

        <form id="expenseForm">

            <label for="expenseName">Expense Name</label>
            <input
                type="text"
                id="expenseName"
                placeholder="e.g. Transport"
                required
            >

            <label for="expenseAmount">Amount (KSh)</label>
            <input
                type="number"
                id="expenseAmount"
                min="0.01"
                step="0.01"
                placeholder="Enter amount"
                required
            >

            <label for="expenseCategory">Category</label>
            <select id="expenseCategory" required>
                <option value="">Select Category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Education">Education</option>
                <option value="Other">Other</option>
            </select>

            <label for="expenseDate">Date</label>
            <input
                type="date"
                id="expenseDate"
                required
            >

            <button type="submit">Add Expense</button>

        </form>

        <p id="message"></p>

    </section>

    <!-- Expense Records -->
    <section class="expense-records">

        <h2>Expense History</h2>

        <table>
            <thead>
                <tr>
                    <th>Expense</th>
                    <th>Category</th>
                    <th>Amount</th>
                    <th>Date</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="expenseList">
                <!-- JavaScript will display expenses here -->
            </tbody>
        </table>

    </section>

</main>

<script src="script.js" defer></script>
